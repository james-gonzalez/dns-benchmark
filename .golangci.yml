# Golangci-lint v2 configuration for dns-bench
# Documentation: https://golangci-lint.run/docs/configuration/

version: "2"

# Run options
run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  go: '1.26'

# Linters configuration
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - unconvert
    - unparam
    - gocritic
    - gosec
    - bodyclose
    - noctx
    - prealloc
    - gocyclo

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false

    govet:
      enable-all: true
      disable:
        - shadow

    gocyclo:
      min-complexity: 15

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated

    revive:
      rules:
        - name: exported
          severity: warning
          disabled: false
        - name: unexported-return
          severity: warning
        - name: error-strings
          severity: warning
        - name: error-naming
          severity: warning
        - name: indent-error-flow
          severity: warning

    staticcheck:
      checks: ["all"]

  exclusions:
    generated: strict

    rules:
      # Exclude some linters from running on test files
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec

      # Exclude known issue with InsecureSkipVerify - intentional for benchmarking
      - path: benchmark/benchmark\.go
        text: "G402: TLS InsecureSkipVerify set true"
        linters:
          - gosec

      # Allow fmt.Printf in main for CLI output
      - path: main\.go
        text: "use of `fmt.Printf`"
        linters:
          - forbidigo

      # Defer close/flush errors are acceptable - standard Go pattern
      - text: "is not checked"
        source: "defer "
        linters:
          - errcheck

      # fmt.Fprintf/Fprintln/w.Flush errors in CLI output are acceptable
      - path: main\.go
        text: "is not checked"
        linters:
          - errcheck

      # http2.ConfigureTransport - already using _ = pattern
      - path: benchmark/benchmark\.go
        text: "is not checked"
        linters:
          - errcheck

      # hugeParam in benchmark.go and distributed.go - pre-existing, refactor not warranted
      - text: "hugeParam"
        linters:
          - gocritic

      # High cyclomatic complexity in Run and GetDomains - pre-existing
      - path: "(benchmark/benchmark|browser/browser)\\.go"
        linters:
          - gocyclo

      # G304: file path from variable - intentional in these files
      - path: "(api/api|dashboard/dashboard|distributed/distributed|browser/browser|main)\\.go"
        text: "G304"
        linters:
          - gosec

      # G104: errors unhandled in tabwriter.Flush - acceptable for CLI output
      - path: main\.go
        text: "G104"
        linters:
          - gosec

      # G703: path traversal in server.go - resultsDir is controlled input
      - path: server\.go
        text: "G703"
        linters:
          - gosec

      # noctx in browser and validation - larger refactor needed
      - path: "(browser/browser|validation/validation)\\.go"
        linters:
          - noctx

      # ST1000: package comments - not required for internal packages
      - text: "ST1000"
        linters:
          - staticcheck

      # fieldalignment: pre-existing struct layout issues
      - text: "fieldalignment"
        linters:
          - govet

      # unusedwrite in test files - struct literal initialization patterns
      - path: _test\.go
        text: "unusedwrite"
        linters:
          - govet

    paths:
      - vendor

# Formatters (gofmt/goimports moved here in v2)
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - dns-bench

# Output configuration
output:
  formats:
    colored-line-number:
      path: stdout
  print-linter-name: true
  print-issued-lines: true
