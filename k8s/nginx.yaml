apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-bench-web
  namespace: dns-benchmark
  labels:
    app: dns-bench-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-bench-web
  template:
    metadata:
      labels:
        app: dns-bench-web
    spec:
      containers:
        - name: dns-bench
          image: ghcr.io/james-gonzalez/dns-benchmark:latest
          args: ["-serve", "80"]
          ports:
            - containerPort: 80
          env:
            - name: DNS_BENCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dns-bench-api-key
                  key: api-key
            - name: DNS_BENCH_RESULTS_DIR
              value: /results
          volumeMounts:
            - name: results
              mountPath: /results
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: dns-bench-results
---
apiVersion: v1
kind: Service
metadata:
  name: dns-bench-web
  namespace: dns-benchmark
  labels:
    app: dns-bench-web
spec:
  selector:
    app: dns-bench-web
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
